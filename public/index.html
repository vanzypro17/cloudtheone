<script>
  function drawSchedule(classes){
    const table = document.getElementById("schedule");
    for(let i = 1 ; i < 10 ; i++){
        for(let j = 1 ; j < 6 ; j++){
            let cell = table.rows[i].cells[j];
            cell.textContent = "";
        }
    }
    for(let i = 0 ; i < classes.length ; i++){
            let lecture = classes[i];
            let duration = lecture["duration"]
            for(let j = 0 ; j < duration ; j++){
                let cell = table.rows[lecture["hour"] + 1 + j].cells[lecture["day"]+1];
                cell.textContent = lecture["id"]+"-"+lecture["name"];
            }
        }   
  }

  function drawSelectlist(classes){
    const select = document.getElementById("drop");
    select.textContent = "";
    for( let i = 0 ; i < classes.length ; i++){
        const option1 = document.createElement("option");
        option1.value = i;
        let text = "";
        if(Number(classes[i]["day"]) == 0){
            text = "MONDAY"
        }
        else if(Number(classes[i]["day"]) == 1){
            text = "TUESDAY"
        }
        else if(Number(classes[i]["day"]) == 2){
            text = "WEDNESDAY"
        }
        else if(Number(classes[i]["day"]) == 3){
            text = "THURSDAY"
        }
        else if(Number(classes[i]["day"]) == 4){
            text = "FRIDAY"
        }
        option1.textContent = text + " " + classes[i]["id"] + " " +  classes[i]["name"];
        select.appendChild(option1);
    }
  }
  const btn = document.getElementById("loginBtn");

  const addcoursebutton = document.getElementById("addCourse");

  const dropbutton = document.getElementById("dropbt")

  let usernamegenel = null;
  let passwordgenel = null;

  let classes = null;


  btn.addEventListener("click", async function () {
    const username1 = document.getElementById("username").value
    const password1 = document.getElementById("password").value
    const response = await fetch("/register",{
        method: "POST",
        headers: {"Content-Type" : "application/json"},
        body: JSON.stringify( { username : username1 , password : password1})

    });
    
    if(response.status == 401){
        document.getElementById("message").textContent = "Yanlış şifre";
        usernamegenel = null;
        passwordgenel = null;
        classes = [];
        drawSchedule(classes);
        drawSelectlist(classes);
    }
    else if(response.ok){
        const data = await response.json();  // status : Login başarılı , classes : array
        console.log(data);                    
        document.getElementById("message").textContent = "giriş başarılı";
        usernamegenel = username1;
        passwordgenel = password1;
        classes = data["classes"];
        drawSchedule(classes);
        drawSelectlist(classes);
    }
  });

  addcoursebutton.addEventListener("click" , async function (){

    if(usernamegenel == null || passwordgenel == null){
        document.getElementById("message").textContent = "First , you need to login or sign in to the system.";
       return;
    }
    let cid = document.getElementById("cid").value;
    let cname = document.getElementById("cname").value;
    let day1 = Number(document.getElementById("day").value);
    let from = Number(document.getElementById("from").value);
    let to = Number(document.getElementById("to").value);

    let duration1 = to - from;
    if(duration1 <= 0) {
       document.getElementById("message").textContent = "GEÇMİŞE AKMIYOR ZAMAN";
       return;
    }
    const response = await fetch("/addclass" , {
        method : "POST" ,
        headers: {"Content-Type" : "application/json"},
        body :JSON.stringify(
        {
        slot: { id: cid, name: cname, hour: from, day: day1, duration: duration1 },
        user: { username: usernamegenel, password: passwordgenel }
        })

    });
    if(response.status == 409){
        document.getElementById("message").textContent = "slot dolu imiş baksana lo";
    }
    else if(response.ok){
        const data = await response.json();
        document.getElementById("message").textContent = data;
        classes.push({ "id": cid, "name": cname, "hour": from, "day": day1, "duration": duration1 })
        drawSchedule(classes);
        drawSelectlist(classes);
    }
    else{
        const detail = await response.json()
        document.getElementById("message").textContent = detail["detail"];
    }
  });

  dropbutton.addEventListener("click" , async function() {
    if(usernamegenel == null || passwordgenel == null){
        document.getElementById("message").textContent = "First , you need to login or sign in to the system.";
       return;
    }
    let class1 = document.getElementById("drop").value;
    if(class1 == null){
        return;
    }
    console.log(classes[class1]);

    let cname = classes[class1]["name"];
    let text = "";
    if(Number(classes[class1]["day"]) == 0){
            text = "MONDAY"
        }
        else if(Number(classes[class1]["day"]) == 1){
            text = "TUESDAY"
        }
        else if(Number(classes[class1]["day"]) == 2){
            text = "WEDNESDAY"
        }
        else if(Number(classes[class1]["day"]) == 3){
            text = "THURSDAY"
        }
        else if(Number(classes[class1]["day"]) == 4){
            text = "FRIDAY"
        }
    
    const response = await fetch("/deleteclass" , {
        method : "POST" ,
        headers: {"Content-Type" : "application/json"},
        body : JSON.stringify(
            {
                slot : {id : classes[class1]["id"] , name : classes[class1]["name"] , hour :  classes[class1]["hour"] , day :  classes[class1]["day"] , duration :  classes[class1]["duration"]},
                user : {username : usernamegenel , password : passwordgenel}
                
            })
    });
    if(response.status == 404){
        document.getElementById("message").textContent = "öyle bir dersin yok";

    }
    else if(response.ok){
        document.getElementById("message").textContent = day + " gününde olan "+ cname + " adlı ders silindi";
        classes.splice( Number(class1) , 1);
        drawSchedule(classes);
        drawSelectlist(classes);
    }
  });
